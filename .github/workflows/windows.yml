name: Windows desktop
on:
  workflow_call:
  push:
    paths:
      - 'legacy/windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'legacy/windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check recognition and duplicate handling using synthetic mail
        shell: powershell
        run: |
          & .\legacy\windows\tests\Test-VerificationCode.ps1
          & .\legacy\windows\tests\Test-MailConfirmation.ps1
          & .\legacy\windows\tests\Test-FoxmailQueue.ps1
          & .\legacy\windows\tests\Test-FoxmailScreen.ps1
      - name: Build the portable application
        run: python legacy/windows/package.py
      - name: Open the packaged app on a clean profile
        shell: powershell
        run: '& .\legacy\windows\tests\Test-PortableRelease.ps1'
      - name: Keep tested Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-desktop
          path: dist/MailAlertMonitor-Windows.zip
          if-no-files-found: error
      - name: Keep the clean-profile window preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-ui
          path: .build/windows-smoke/overview.png
          include-hidden-files: true
          if-no-files-found: error
